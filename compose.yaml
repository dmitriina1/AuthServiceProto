name: authservice-prototype

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: authservice
      POSTGRES_USER: authservice
      POSTGRES_PASSWORD: authservice-development-only
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authservice -d authservice" ]
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=authservice;Username=authservice;Password=authservice-development-only
      AuthServer__Issuer: http://localhost:5230/
    env_file:
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:5230:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth

volumes:
  postgres-data:
